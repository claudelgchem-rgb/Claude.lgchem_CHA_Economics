# Streamlit theme — bold premium dashboard (presentation only; no logic)
# 색 톤을 바꾸려면 아래 4개 색만 교체하면 됩니다. 기준: docs/DESIGN_PRINCIPLES.md
[theme]
base = "light"

# 단일 액센트 — 딥 틸(신뢰감 있는 산업/금융 톤). 네온/그라데이션 금지.
primaryColor = "#0F766E"

# 쿨 그레이 캔버스 (그 위에 흰 시트가 '떠 보이게' 만드는 핵심)
backgroundColor = "#ECEFF3"

# 카드/입력/사이드바 = 화이트
secondaryBackgroundColor = "#FFFFFF"

# 딥 슬레이트 잉크 텍스트(순흑 아님)
textColor = "#16202B"

font = "sans serif"
